<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Omnis Start">
  <!--
    Neutral placeholder mark: a solid dot with a punched-out centre. Colours
    invert on dark browser chrome so the dot never sinks into the tab bar.
  -->
  <style>
    .dot { fill: #111111; }
    .hole { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .dot { fill: #fafafa; }
      .hole { fill: #111111; }
    }
  </style>
  <circle class="dot" cx="16" cy="16" r="14" />
  <circle class="hole" cx="16" cy="16" r="5.5" />
</svg>
