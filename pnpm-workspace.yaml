minimumReleaseAge: 10080
# Exact releases let through the age gate for the Astro 7.3 upgrade (scoped-style HMR
# fix, withastro/astro#18075). Pinned to the version, so later releases still wait the
# full week. The newest here, postcss 8.5.30, matures on 2026-10-19 — after that this
# list can go.
minimumReleaseAgeExclude:
  - astro@7.3.8
  - vite@8.3.4
  - "@astrojs/react@7.0.1"
  - "@astrojs/internal-helpers@0.12.0"
  - "@astrojs/markdown-satteri@0.4.3"
  # Patch releases the bypassed install pulled in transitively; already in the lockfile,
  # and pnpm re-checks them on every later `pnpm add`.
  - rolldown@1.2.13
  # pnpm takes no version on a name pattern. Safe without one: rolldown pins its native
  # bindings exactly, so a binding only ever arrives through a rolldown that passed the gate.
  - "@rolldown/binding-*"
  - postcss@8.5.30
  - p-queue@9.3.5
  - smol-toml@1.9.1

allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  sqlite3: true

# `@responsive-image/vite-plugin` asks for sharp ^0.35 while astro pins ^0.34, so both
# were installed and both libvips loaded into the same `astro build` process — macOS
# reports the duplicate as `Class GNotificationCenterDelegate is implemented in both`
# and warns about "spurious casting failures and mysterious crashes".
#
# `$sharp` resolves to the version in this package.json's own dependencies, which exists
# to match what astro resolves to. The plugin follows astro rather than the other way
# round, because astro is the one with a sharp in the server bundle; the plugin only runs
# at build time.
#
# This is below the plugin's declared range, so it was measured rather than assumed.
# JPEG and WebP come out byte-identical. AVIF does not: libvips 8.17 encodes it ~13%
# larger than 8.18 (159 kB -> 179 kB over the 11 AVIF variants in this repo), because the
# older libaom is less efficient. That is the price of the override, and it is worth
# knowing it is reversible — drop these two lines and `pnpm install` puts 0.35 back.
#
# The counterweight: before this, the two halves of the site shipped AVIF from two
# different encoders. Astro's pages were already on 0.34 and always will be.
overrides:
  sharp: "$sharp"
  # One Vite for everything. The TanStack Start plugins run inside Astro's Vite config
  # (`composeAstroTanStackBuild` in astro.config.ts), so a second copy would hand them
  # a different module graph, environment classes and HMR pipeline than the server they
  # run in, and `instanceof`/`isRunnableDevEnvironment` checks across the two fail
  # silently. `$vite` is the version in this package.json, the one place to bump it.
  vite: "$vite"
